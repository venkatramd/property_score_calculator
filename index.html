<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column; on wide screens a property list rail beside the scoring sheet. Sticky score bar on top of the sheet. */
/* Palette: cool greys + one navy accent. Red is reserved for a failed gate. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1d2433; --muted:#667085; --line:#e3e6eb;
  --accent:#24426b; --accent-soft:#eef2f8;
  --bad:#b42318; --bad-soft:#fdf1f0;
  --good:var(--accent); --good-soft:var(--accent-soft); --warn:var(--ink); --warn-soft:var(--bg);
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --surface:#191d23; --ink:#e6e8eb; --muted:#9aa3ae; --line:#2a3038;
    --accent:#9bb7de; --accent-soft:#1f2937;
    --bad:#f0857a; --bad-soft:#3a1f1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#191d23; --ink:#e6e8eb; --muted:#9aa3ae; --line:#2a3038;
  --accent:#9bb7de; --accent-soft:#1f2937;
  --bad:#f0857a; --bad-soft:#3a1f1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.app{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.app{grid-template-columns:300px 1fr;align-items:start}}

header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
header.top h1{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted);font-size:.9rem}
.status{font-size:.78rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.status.local::before{background:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.rail{display:flex;flex-direction:column;gap:10px;padding:12px}
@media (min-width:900px){.rail{position:sticky;top:16px}}
.rail-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rail-head h2{font-size:.95rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:4px 10px;font-size:.85rem}
.plist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.pcard{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.pcard[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pcard .pn{font-weight:600;overflow-wrap:anywhere}
.pcard .pt{color:var(--muted);font-size:.8rem}
.pcard .ps{grid-row:1/3;grid-column:2;text-align:right;font-size:.8rem;color:var(--muted)}
.pcard .ps b{display:block;font-size:1rem;color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 8px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.sheet{display:flex;flex-direction:column;gap:12px;min-width:0}
.meta{padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.78rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.field.wide{grid-column:1/-1}
.field textarea{min-height:56px;resize:vertical}

.scorebar{position:sticky;top:0;z-index:5;padding:12px;display:grid;gap:10px;grid-template-columns:1fr 1fr;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.score{display:flex;flex-direction:column;gap:4px}
.score .lbl{font-size:.78rem;color:var(--muted);font-weight:500}
.score .val{font-size:1.9rem;font-weight:600;line-height:1}
.score .val small{font-size:.9rem;color:var(--muted);font-weight:500}
.meter{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}
.band{font-size:.8rem;font-weight:500;color:var(--muted)}
.verdict{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-weight:500;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pill.good{color:var(--accent);border-color:var(--accent)}
.pill.warn{color:var(--ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.neutral{color:var(--muted)}
.c-good,.c-warn{color:var(--muted)} .c-bad{color:var(--bad)}

details.section{overflow:hidden}
details.section>summary{list-style:none;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
details.section>summary::-webkit-details-marker{display:none}
details.section>summary h3{font-size:1rem}
.sum-sub{font-size:.8rem;color:var(--muted)}
.sum-pts{grid-row:1/3;grid-column:2;text-align:right;font-size:.8rem;color:var(--muted)}
.sum-pts b{font-size:.95rem;color:var(--ink)}
details.section[open]>summary{border-bottom:1px solid var(--line)}
.items{display:flex;flex-direction:column}
.item{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.item:last-child{border-bottom:0}
.item.gate{box-shadow:inset 3px 0 0 var(--accent)}
.item.gate.fail{box-shadow:inset 3px 0 0 var(--bad);background:var(--bad-soft)}
.ihead{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.ihead .it{font-weight:600}
.ihead .iid{color:var(--muted);font-size:.78rem;margin-right:6px}
.gbadge{font-size:.68rem;font-weight:600;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.rates{display:flex;gap:4px;flex-wrap:wrap}
.rates button{min-width:40px;height:36px;border:1px solid var(--line);background:var(--bg);border-radius:7px;font-family:var(--font-num);font-weight:600}
.rates button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.rates button.unk[aria-pressed="true"]{background:var(--muted);border-color:var(--muted)}
.rates button.zero[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.hint{font-size:.83rem;color:var(--muted);display:grid;gap:2px}
.hint b{color:var(--ink);font-weight:600}
.guide-toggle{border:0;background:none;color:var(--accent);font-size:.8rem;padding:0;text-align:left;width:max-content}

.compare{padding:12px;overflow-x:auto}
.compare table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.compare th,.compare td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.compare th{font-size:.78rem;color:var(--muted);font-weight:500}
.compare td.n{text-align:right}
.compare tr.click{cursor:pointer}
.compare tr.click:hover td{background:var(--accent-soft)}
.legend{padding:12px;font-size:.85rem;color:var(--muted);display:grid;gap:4px}
.legend b{color:var(--ink)}
.banner{padding:10px 12px;border-radius:var(--radius);background:var(--accent-soft);color:var(--ink);font-size:.88rem;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.empty{color:var(--muted);font-size:.88rem;padding:6px 2px}
.guide{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:72ch}
.guide h2{font-size:1.05rem}
.guide h3{font-size:.95rem;margin-top:4px}
.guide p,.guide li{margin:0;color:var(--ink)}
.guide ol,.guide ul{margin:0;padding-left:20px;display:grid;gap:4px}
.guide .muted{color:var(--muted);font-size:.88rem}
.guide table{border-collapse:collapse;font-size:.88rem;width:100%}
.guide th,.guide td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.guide th{font-size:.78rem;color:var(--muted);font-weight:500}
.guide td.n,.guide th.n{text-align:right}
.guide .tw{overflow-x:auto}
.guide-types{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Property Scorer</h1>
      <p>Rate each item 0–5 as you walk the property. Unknown counts as 3 until you check it.</p>
    </div>
    <span id="status" class="status local">Saved in this browser only</span>
  </header>

  <aside class="panel rail" aria-label="Your properties">
    <div class="rail-head">
      <h2>Your properties</h2>
      <button class="btn primary small" id="newBtn" type="button">+ New</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabScore" aria-selected="true" type="button">Score</button>
      <button role="tab" id="tabCompare" aria-selected="false" type="button">Compare</button>
      <button role="tab" id="tabGuide" aria-selected="false" type="button">Guide</button>
    </div>
    <ul class="plist" id="plist"></ul>
  </aside>

  <main class="sheet" id="sheet"></main>
</div>

const UNKNOWN_AS=3;

/* ---------- Scoring ---------- */
function scoreProperty(p){
  const t=TYPES[p.type]; const r=p.ratings||{};
  let self=0,inv=0,total=0,known=0;
  const gates={pass:0,weak:0,fail:0,unknown:0};
  const sections=t.sections.map(s=>{
    let sum=0,rated=0;
    s.items.forEach(it=>{
      const v=r[it.id]; const has=typeof v==="number";
      total++; if(has){known++;rated++;}
      sum+= has?v:UNKNOWN_AS;
      if(it.gate){ if(!has)gates.unknown++; else if(v===0)gates.fail++; else if(v<=2)gates.weak++; else gates.pass++; }
    });
    const avg=sum/s.items.length;
    const ps=s.ws*avg/5, pi=s.wi*avg/5;
    self+=ps; inv+=pi;
    return {id:s.id,avg,ps,pi,rated,count:s.items.length};
  });
  return {self,inv,sections,gates,known,total};
}
function band(score){
  if(score>=80) return {t:"Strong",c:"good"};
  if(score>=65) return {t:"Good, negotiate weak spots",c:"good"};
  if(score>=50) return {t:"Borderline",c:"warn"};
  return {t:"Skip",c:"bad"};
}
function gateVerdict(g){
  if(g.fail) return {t:`Do not buy: ${g.fail} gate failed`,c:"bad"};
  if(g.unknown) return {t:`${g.unknown} gate${g.unknown>1?"s":""} unchecked, no token yet`,c:"warn"};
  if(g.weak) return {t:`${g.weak} gate${g.weak>1?"s":""} weak, get a lawyer's view`,c:"warn"};
  return {t:"All gates passed",c:"good"};
}

async function connectDb(){
  if(!window.claude || typeof window.claude.use!=="function") return;
  try{
    const db=await window.claude.use("db"); const user=await window.claude.use("user");
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const col=db.collection("data/users/"+id);
    const timer=setTimeout(()=>setStatus("Can't reach your account yet, saving in this browser","local"),10000);
    const dbStore={kind:"db",
      save(p){return col.doc(p.id).set(cleanForSave(p));},
      remove(id2){return col.doc(id2).delete();}
    };
    col.onSnapshot(snap=>{
      clearTimeout(timer);
      if(store!==dbStore){
        store=dbStore; setStatus("Saved to your account","db");
        // move anything kept only in this browser into the account, once
        const localOnly=localStore.load().filter(lp=>!snap.docs.some(d=>d.id===lp.id));
        localOnly.forEach(lp=>{ col.doc(lp.id).set(cleanForSave(lp)).catch(()=>{}); });
        if(localOnly.length){ try{localStorage.removeItem(LS_KEY);}catch(e){} }
      }
      const remote=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      // keep in-progress local edits that haven't been written yet
      const merged=remote.map(rp=>{const lp=props.find(x=>x.id===rp.id); return (lp && timers[rp.id] && lp.updated>(rp.updated||0))?lp:rp;});
      props.filter(lp=>!lp.example && !merged.some(m=>m.id===lp.id) && timers[lp.id]).forEach(lp=>merged.push(lp));
      const ex=props.find(p=>p.example);
      props=merged.length?merged:(ex?[ex]:[structuredClone(EXAMPLE)]);
      if(!current()) currentId=props[0].id;
      render(true);
    },()=>{ clearTimeout(timer); setStatus("Couldn't reach your account, saving in this browser","local"); store=localStore; });
  }catch(e){ /* stay on local storage */ }
}

  g.append(

function render(keepScroll){
  renderList();
  if(view==="compare") renderCompare(); else if(view==="guide") renderGuide(); else renderScore(keepScroll);
}

function newProperty(){
  const p={id:uid(),name:"",type:(current()&&current().type)||"resale",price:"",visited:new Date().toISOString().slice(0,10),notes:"",ratings:{},updated:Date.now()};
  props=props.filter(x=>!x.example); props.push(p); currentId=p.id; view="score"; confirmDelete=false; openSections=new Set([TYPES[p.type].sections[0].id]);
  flushSave(p.id); render(); const f=document.getElementById("f-name"); if(f) f.focus();
}
function deleteCurrent(){
  const p=current(); if(!p) return; clearTimeout(timers[p.id]); delete timers[p.id];
  props=props.filter(x=>x.id!==p.id);
  store.remove(p.id).catch(()=>{});
  if(!props.length) props=[structuredClone(EXAMPLE)];
  currentId=props[0].id; confirmDelete=false; render();
}

document.getElementById("newBtn").addEventListener("click",newProperty);
document.getElementById("tabScore").addEventListener("click",()=>{view="score";render();});
document.getElementById("tabCompare").addEventListener("click",()=>{view="compare";render();});
document.getElementById("tabGuide").addEventListener("click",()=>{view="guide";const c=current();if(c)guideType=c.type;render();});

/* ---------- Start ---------- */
props=localStore.load();
if(!props.length) props=[structuredClone(EXAMPLE)];
currentId=props[0].id;
openSections=new Set([TYPES[props[0].type].sections[0].id]);
render();
connectDb();
</script>
